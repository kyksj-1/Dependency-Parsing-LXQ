[Embed]
pretrained_embed = True
zeros = False
avg = True
uniform = False
nnembed = False
pretrained_embed_file = ./Data/Embed/giga.100.txt.sample

[Data]
train_file = ./Data/ctb51/train.conll
dev_file = ./Data/ctb51/dev.conll
test_file = ./Data/ctb51/dev.conll
max_count = -1
min_freq = 1
shuffle = True
epochs_shuffle = True

[Save]
save_pkl = False
pkl_directory = ./Save_All/Save_pkl
pkl_data = pkl_data.pkl
pkl_alphabet = pkl_alphabet.pkl
pkl_iter = pkl_iter.pkl
pkl_embed = pkl_embed.pkl
save_dict = True
dict_directory = ./Save_All/Save_dictionary
word_dict = dictionary_word.txt
label_dict = dictionary_label
save_direction = ./Output
save_best_model_dir = ./Output/best_model_legacy
save_model = True
save_all_model = False
save_best_model = True
model_name = Biaffine_Parsing
rm_model = True

[Model]
embed_dim = 100
tag_dims = 100
dropout_emb = 0.5
dropout = 0.5
lstm_layers = 3
lstm_hiddens = 400
dropout_lstm_input = 0.33
dropout_lstm_hidden = 0.33
mlp_arc_size = 500
mlp_rel_size = 100
dropout_mlp = 0.33

[Encoder]
# Stage 2 编码器开关。type 取值:
#   lstm                  - Stage 1 原版 BiLSTM
#   transformer           - Phase 3 small SDPA encoder (~9M, d_model=512/L=4)
#   transformer_large     - Phase 4 SOTA encoder (~75M, +RoPE +SwiGLU +LayerScale +Pre-LN)
# 当 type=transformer_large 时,下面的 large_* 字段生效,其他字段忽略。
type = lstm
d_model = 512
nhead = 8
num_layers = 4
ff_size = 1024
dropout = 0.33
norm_first = False
activation = gelu

# ---- 仅 type=transformer_large 时生效 ----
large_d_model = 768
large_nhead = 12
large_num_layers = 8
large_ff_size = 3072
large_dropout = 0.4
large_layerscale_init = 1e-4
large_use_rope = True

[Optimizer]
adam = True
sgd = False
muon = False
learning_rate = 0.001
weight_decay = 1e-9
clip_max_norm_use = True
clip_max_norm = 9
use_lr_decay = False
lr_rate_decay = 0.5
min_lrate = 0.000005
max_patience = 2

[Train]
num_threads = 1
epochs = 50
early_max_patience = 20
update_batch_size = 4
batch_size = 32
dev_batch_size = 32
test_batch_size = 32
log_interval = 50
# ---- 仅 Phase 4 SOTA run 启用,默认关闭以保持 Stage 1 / Phase 3 行为不变 ----
use_warmup_cosine = False
warmup_steps = 1500
min_lr_ratio = 0.01
use_ema = False
ema_decay = 0.999
